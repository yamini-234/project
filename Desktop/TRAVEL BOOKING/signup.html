<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelGo - Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                ✈️ TravelGo
            </div>


            <h1>Create Account</h1>

            <p>
                Start your journey with TravelGo
            </p>


            <form id="signupForm">


                <!-- NAME -->

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>


                <!-- EMAIL -->

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required>


                <!-- PASSWORD -->

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required>


                <!-- CONFIRM PASSWORD -->

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-submit">

                    Create Account

                </button>

            </form>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script>

        document.getElementById(
            "signupForm"
        ).addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "name"
                    ).value;


                const email =
                    document.getElementById(
                        "signupEmail"
                    ).value;


                const password =
                    document.getElementById(
                        "signupPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                // CHECK PASSWORD

                if (password !== confirmPassword) {

                    alert(
                        "Passwords do not match!"
                    );

                    return;

                }


                // SAVE USER INFORMATION

                localStorage.setItem(
                    "userName",
                    name
                );

                localStorage.setItem(
                    "userEmail",
                    email
                );

                localStorage.setItem(
                    "userPassword",
                    password
                );


                // SUCCESS MESSAGE

                alert(
                    "Account created successfully! 🎉\n\n" +
                    "Welcome, " +
                    name +
                    "!"
                );


                // GO TO LOGIN

                window.location.href =
                    "login.html";

            }
        );

    </script>

</body>

</html>
